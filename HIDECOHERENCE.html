<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoherence XXIII — Asistente Virtual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #10b981;
            --accent-dark: #059669;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 520px;
            height: 90vh;
            max-height: 800px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .chat-header {
            background: var(--primary);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .chat-header .logo {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }
        .chat-header .info h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .chat-header .info p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .chat-header .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            color: #34d399;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeInUp 0.4s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.bot {
            background: #f1f5f9;
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 18px 16px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-light);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            animation: fadeInUp 0.4s ease;
        }
        .option-btn {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-btn:hover {
            border-color: var(--accent);
            background: #ecfdf5;
            color: var(--accent-dark);
            transform: translateX(4px);
        }
        .option-btn .icon {
            font-size: 16px;
            flex-shrink: 0;
        }
        .summary-box {
            background: #f0fdfa;
            border: 1.5px solid #99f6e4;
            border-radius: 14px;
            padding: 16px;
            margin-top: 8px;
        }
        .summary-box h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #ccfbf1;
            font-size: 13px;
        }
        .summary-item:last-child { border-bottom: none; }
        .summary-item .label { color: var(--text-light); }
        .summary-item .value { font-weight: 600; color: var(--text); }
        .send-btn {
            display: block;
            width: 100%;
            margin-top: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }
        .send-btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .send-btn:active { transform: translateY(0); }
        .restart-btn {
            display: inline-block;
            margin-top: 10px;
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-light);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .restart-btn:hover { border-color: var(--text-light); color: var(--text); }
        .highlight { color: var(--accent-dark); font-weight: 600; }
        .price-tag {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 6px;
        }
        @media (max-width: 540px) {
            body { padding: 0; }
            .chat-container { height: 100vh; max-height: none; border-radius: 0; border: none; }
        }
    </style>
<base target="_blank">
<base target="_blank">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo">DX</div>
            <div class="info">
                <h1>Decoherence XXIII</h1>
                <p>Asistente de Bienestar Integral</p>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                En línea
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        let conversationData = [];
        let userProfile = {
            nombre: '',
            objetivo: '',
            interes: '',
            detalle: '',
            urgencia: '',
            contacto: ''
        };

        function addMessage(text, isUser = false, isTyping = false) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'} ${isTyping ? 'typing' : ''}`;
            if (isTyping) {
                div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
            } else {
                div.innerHTML = text;
            }
            chatMessages.appendChild(div);
            if (isUser) {
                div.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return div;
        }

        function removeTyping() {
            const typing = document.querySelector('.typing');
            if (typing) typing.remove();
        }

        function botSay(text, delay = 600) {
            return new Promise(resolve => {
                const typing = addMessage('', false, true);
                setTimeout(() => {
                    removeTyping();
                    const msg = addMessage(text, false);
                    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    resolve();
                }, delay);
            });
        }

        function addOptions(options) {
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="icon">${opt.icon}</span> ${opt.text}`;
                btn.onclick = () => {
                    conversationData.push({ question: opt.question || 'Selección', answer: opt.text });
                    addMessage(`<b>${opt.text}</b>`, true);
                    grid.remove();
                    opt.action();
                };
                grid.appendChild(btn);
            });
            chatMessages.appendChild(grid);
        }

        function addInput(placeholder, onSubmit, type = 'text') {
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'display:flex;gap:8px;margin-top:8px;max-width:85%;align-self:flex-end;width:100%;';
            const input = document.createElement('input');
            input.type = type;
            input.placeholder = placeholder;
            input.style.cssText = 'flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;outline:none;';
            const btn = document.createElement('button');
            btn.innerHTML = '→';
            btn.style.cssText = 'width:40px;height:40px;border:none;border-radius:12px;background:var(--accent);color:white;font-size:18px;cursor:pointer;flex-shrink:0;';

            function submit() {
                if (!input.value.trim()) return;
                const val = input.value.trim();
                conversationData.push({ question: placeholder, answer: val });
                addMessage(val, true);
                wrapper.remove();
                onSubmit(val);
            }

            input.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
            btn.onclick = submit;
            wrapper.appendChild(input);
            wrapper.appendChild(btn);
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            input.focus();
        }

        function showSummaryAndSend() {
            let summaryHTML = `
                <div class="summary-box">
                    <h3>📋 Resumen de tu solicitud</h3>
                    <div class="summary-item"><span class="label">Nombre:</span><span class="value">${userProfile.nombre || 'No proporcionado'}</span></div>
                    <div class="summary-item"><span class="label">Interés principal:</span><span class="value">${userProfile.interes || 'No especificado'}</span></div>
                    <div class="summary-item"><span class="label">Objetivo:</span><span class="value">${userProfile.objetivo || 'No especificado'}</span></div>
                    <div class="summary-item"><span class="label">Por qué lo quiere / Detalle:</span><span class="value">${userProfile.detalle || 'No especificado'}</span></div>
                    <div class="summary-item"><span class="label">Urgencia:</span><span class="value">${userProfile.urgencia || 'No especificada'}</span></div>
                    <div class="summary-item"><span class="label">Contacto:</span><span class="value">${userProfile.contacto || 'No proporcionado'}</span></div>
                </div>
            `;

            let waMessage = `Hola, adjunto mi solicitud.%0A%0A`;
            waMessage += `*Nombre:* ${userProfile.nombre || 'No proporcionado'}%0A`;
            waMessage += `*Interés principal:* ${userProfile.interes || 'No especificado'}%0A`;
            waMessage += `*Objetivo:* ${userProfile.objetivo || 'No especificado'}%0A`;
            waMessage += `*Por qué lo quiere / Detalle:* ${userProfile.detalle || 'No especificado'}%0A`;
            waMessage += `*Urgencia:* ${userProfile.urgencia || 'No especificada'}%0A`;
            waMessage += `*Contacto:* ${userProfile.contacto || 'No proporcionado'}%0A%0A`;
            waMessage += `Historial completo:%0A`;
            conversationData.forEach((item, i) => {
                waMessage += `${i+1}. ${item.question}: ${item.answer}%0A`;
            });

            const waLink = `https://wa.me/525535691939?text=${waMessage}`;

            summaryHTML += `<a href="${waLink}" target="_blank" class="send-btn">📤 Enviar mis respuestas a Decoherence para que me atienda un agente</a>`;
            summaryHTML += `<button class="restart-btn" onclick="location.reload()">🔄 Iniciar nueva conversación</button>`;

            addMessage(summaryHTML, false);
        }

        // ==================== FLUJOS ====================

        async function start() {
            await botSay('¡Hola! Soy el asistente virtual de <b>Decoherence XXIII</b>. 🌿✨<br><br>Estoy aquí para entender qué necesitas y por qué lo necesitas, para que nuestro equipo te brinde la mejor atención. Cuéntame, ¿en qué puedo apoyarte hoy?');
            addOptions([
                { icon: '🛒', text: 'Comprar INSULESTERON', question: 'Interés principal', action: flowComprarInsulesteron },
                { icon: '💆', text: 'Agendar Sesión de Aparatología Facial', question: 'Interés principal', action: flowAparatologia },
                { icon: '💎', text: 'Conocer las membresías', question: 'Interés principal', action: flowConocerMembresias },
                { icon: '⭐', text: 'Comprar una membresía', question: 'Interés principal', action: flowComprarMembresia },
                { icon: '🔬', text: '¿Para qué sirve INSULESTERON?', question: 'Interés principal', action: flowInfoInsulesteron },
                { icon: '✨', text: '¿Para qué sirve la Aparatología Facial?', question: 'Interés principal', action: flowInfoAparatologia },
                { icon: '🔧', text: 'Resolver un problema', question: 'Interés principal', action: flowResolverProblema },
                { icon: '⚖️', text: 'Bajar de peso', question: 'Interés principal', action: flowBajarPeso },
                { icon: '❤️', text: 'Prevenir enfermedades cardiometabólicas', question: 'Interés principal', action: flowCardiometabolico },
                { icon: '❓', text: '¿Cómo funciona Decoherence?', question: 'Interés principal', action: flowComoFunciona },
            ]);
        }

        // ---- FLUJO: COMPRAR INSULESTERON ----
        async function flowComprarInsulesteron() {
            userProfile.interes = 'Comprar INSULESTERON';
            await botSay('<b>INSULESTERON</b> es nuestra formulación insignia en polvo: 300g, diseñada para regular la insulina, mejorar el perfil lipídico y reducir inflamación de bajo grado.<br><br>¿Es tu primera vez con INSULESTERON o ya lo has usado antes?');
            addOptions([
                { icon: '🆕', text: 'Es mi primera vez', question: 'Experiencia con INSULESTERON', action: async () => {
                    userProfile.detalle = 'Primera vez. Quiere probar INSULESTERON para mejorar su metabolismo y bienestar integral.';
                    await botSay('¡Perfecto! Como es tu primera vez, ¿qué te motivó a buscar INSULESTERON?');
                    addOptions([
                        { icon: '🩺', text: 'Me recomendaron por problemas metabólicos', question: 'Motivación', action: () => preguntarPorQue('Problemas metabólicos') },
                        { icon: '⚡', text: 'Quiero mejorar mi energía y vitalidad', question: 'Motivación', action: () => preguntarPorQue('Energía y vitalidad') },
                        { icon: '🛡️', text: 'Prevención general de salud', question: 'Motivación', action: () => preguntarPorQue('Prevención general') },
                        { icon: '🔍', text: 'Vi buenos resultados en alguien más', question: 'Motivación', action: () => preguntarPorQue('Referencia de terceros') },
                        { icon: '🔙', text: 'Atrás', question: 'Navegación', action: () => { if (conversationData.length > 0) conversationData.pop(); start(); } },
                    ]);
                }},
                { icon: '♻️', text: 'Ya lo he usado antes', question: 'Experiencia con INSULESTERON', action: async () => {
                    userProfile.detalle = 'Usuario recurrente. Ya conoce los beneficios y desea continuar.';
                    await botSay('¡Genial! ¿Qué resultados has notado con INSULESTERON que te hace querer comprarlo de nuevo?');
                    addOptions([
                        { icon: '📉', text: 'Mejoró mi metabolismo / glucosa', question: 'Resultado previo', action: () => preguntarPorQue('Mejoría metabólica') },
                        { icon: '⚡', text: 'Más energía y menos antojos', question: 'Resultado previo', action: () => preguntarPorQue('Más energía') },
                        { icon: '⚖️', text: 'Me ayudó a controlar mi peso', question: 'Resultado previo', action: () => preguntarPorQue('Control de peso') },
                        { icon: '✅', text: 'Me siento mejor en general', question: 'Resultado previo', action: () => preguntarPorQue('Bienestar general') },
                        { icon: '🔙', text: 'Atrás', question: 'Navegación', action: () => { if (conversationData.length > 0) conversationData.pop(); start(); } },
                    ]);
                }},
            ]);
        }

        async function preguntarPorQue(motivo) {
            userProfile.objetivo = motivo;
            await botSay('¿Cuál es tu nombre completo?');
            addInput('Escribe tu nombre completo...', async (val) => {
                userProfile.nombre = val;
                await botSay('¿Cuál es tu número de WhatsApp?');
                addInput('Ej: 55 1234 5678', async (val2) => {
                    userProfile.contacto = val2;
                    await botSay('¿Con qué urgencia necesitas iniciar con INSULESTERON?');
                    addOptions([
                        { icon: '🔥', text: 'Lo antes posible', question: 'Urgencia', action: () => { userProfile.urgencia = 'Inmediata'; showSummaryAndSend(); } },
                        { icon: '📅', text: 'Esta semana', question: 'Urgencia', action: () => { userProfile.urgencia = 'Esta semana'; showSummaryAndSend(); } },
                        { icon: '📆', text: 'En el mes', question: 'Urgencia', action: () => { userProfile.urgencia = 'Este mes'; showSummaryAndSend(); } },
                        { icon: '🔙', text: 'Atrás', question: 'Navegación', action: () => { if (conversationData.length > 0) conversationData.pop(); start(); } },
                    ]);
                });
            });
        }

        // ---- FLUJO: APARATOLOGÍA FACIAL ----
        async function flowAparatologia() {
            userProfile.interes = 'Agendar Sesión de Aparatología Facial';
            await botSay('Nuestra <b>Aparatología Facial</b> utiliza tecnología avanzada para el cuidado y realce de tu piel.<br><br>¿Qué resultado esperas obtener con tu sesión?');
            addOptions([
                { icon: '💧', text: 'Limpieza profunda y hidratación', question: 'Resultado esperado', action: () => agendarDetalle('Limpieza profunda') },
                { icon: '⚡', text: 'Reafirmación y colágeno', question: 'Resultado esperado', action: () => agendarDetalle('Reafirmación') },
                { icon: '✨', text: 'Mejorar textura y luminosidad', question: 'Resultado esperado', action: () => agendarDetalle('Textura y luminosidad') },
                { icon: '🎁', text: 'Paquete completo de varios tratamientos', question: 'Resultado esperado', action: () => agendarDetalle('Paquete combinado') },
                { icon: '🔙', text: 'Atrás', question: 'Navegación', action: () => { if (conversationData.length > 0) conversationData.pop(); start(); } },
            ]);
        }

        async function agendarDetalle(resultado) {
            userProfile.objetivo = resultado;
            await botSay(`Entendido, buscas <b>${resultado}</b>. ¿Es para ti o para regalar/transferir a alguien más?`);
            addOptions([
                { icon: '🙋', text: 'Es para mí', question: 'Beneficiario', action: async () => {
                    userProfile.detalle = 'Para sí mismo. Busca ' + resultado + ' en su piel.';
                    await botSay('¿Cuál es tu nombre completo?');
                    addInput('Escribe tu nombre...', async (val) => {
                        userProfile.nombre = val;
                        await botSay('¿Cuál es tu número de WhatsApp?');
                        addInput('Ej: 55 1234 5678', async (val2) => {
                            userProfile.contacto = val2;
                            await botSay('¿Qué día de la semana te funciona mejor?');
                            addOptions([
                                { icon: '📅', text: 'Lunes a Viernes', question: 'Disponibilidad', action: () => { userProfile.urgencia = 'Entre semana'; showSummaryAndSend(); } },
                                { icon: '📅', text: 'Sábado', question: 'Disponibilidad', action: () => { userProfile.urgencia = 'Sábado'; showSummaryAndSend(); } },
                                { icon: '📅', text: 'Cualquier día', question: 'Disponibilidad', action: () => { userProfile.urgencia = 'Flexible'; showSummaryAndSend(); } },
                                { icon: '🔙', text: 'Atrás', question: 'Navegación', action: () => { if (conversationData.length > 0) conversationData.pop(); start(); } },
                            ]);
                        });
                    });
                }},
                { icon: '🎁', text: 'Es para otra persona', question: 'Beneficiario', action: async () => {
                    userProfile.detalle = 'Para tercero. Busca ' + resultado + ' para regalar.';
                    await botSay('¿Cuál es el nombre completo de la persona beneficiaria?');
                    addInput('Nombre del beneficiario...', async (val) => {
                        userProfile.nombre = val;
                        await botSay('¿Cuál es su número de WhatsApp?');
                        addInput('WhatsApp del beneficiario...', async (val2) => {
                            userProfile.contacto = val2;
                            await botSay('¿Y tu nombre y número para coordinar la transferencia de la sesión?');
                            addInput('Tu nombre...', async (val3) => {
                                conversationData.push({ question: 'Datos del comprador', answer: val3 });
                                await botSay('¿Qué tan pronto prefieres agendar?');
                                addOptions([
                                    { icon: '📅', text: 'Esta semana', question: 'Urgencia', action: () => { userProfile.urgencia = 'Esta semana'; showSummaryAndSend(); } },
                                    { icon: '📆', text: 'Próxima semana', question: 'Urgencia', action: () => { userProfile.urgencia = 'Próxima semana'; showSummaryAndSend(); } },
                                    { icon: '🔙', text: 'Atrás', question: 'Navegación', action: () => { if (conversationData.length > 0) conversationData.pop(); start(); } },
                                ]);
                            });
                        });
                    });
                }},
            ]);
        }

        // ---- FLUJO: CONOCER MEMBRESÍAS ----
        async function flowConocerMembresias() {
            userProfile.interes = 'Conocer membresías';
            await botSay('Tenemos <b>4 niveles de membresía</b> diseñados para diferentes necesidades. Todas incluyen el Plan de Control Metabólico-Conductual, análisis de composición corporal, suero oral y Tarjeta de Miembros con descuentos locales.<br><br>¿Qué buscas principalmente en una membresía?');
            addOptions([
